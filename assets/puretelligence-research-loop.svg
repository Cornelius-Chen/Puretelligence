<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">Puretelligence research loop: point-in-time evidence, independent decisions, historical replay and candidate revision</title>
<desc id="desc">Market observations admitted before a cutoff form a packet. A continuing trader can consult an exact Jervis candidate version. Separate hold, sell, buy and switch hypotheses enter replay with cash, inventory and cost accounting. Outcomes and failures are diagnosed after the decision. A candidate revision can be stored for later testing, but is not automatically promoted or used for live orders.</desc>
<defs><style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17243b}.bg{fill:#f7f8f6}.card{fill:#fff;stroke:#c9d4d9;stroke-width:2}.teal{fill:#e4f0f0;stroke:#358889;stroke-width:2}.blue{fill:#e9eef9;stroke:#5875b8;stroke-width:2}.amber{fill:#fdf0e2;stroke:#bd8346;stroke-width:2}.title{font-weight:700;font-size:30px}.label{font-weight:700;font-size:24px}.small{font-size:19px}.muted{fill:#566778;font-size:20px}.arrow{fill:none;stroke:#5a6d7e;stroke-width:3;marker-end:url(#head)}.dash{stroke-dasharray:9 8}
</style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#5a6d7e" stroke-width="2"/></marker></defs>
<rect class="bg" width="1500" height="700"/><text x="60" y="59" class="title">From evidence to a revisable trader hypothesis</text><text x="60" y="95" class="muted">Point-in-time research · independent action tests · versioned experience</text>
<rect x="60" y="145" width="290" height="151" rx="14" class="card"/><text x="84" y="188" class="label">01  Market evidence</text><text x="84" y="226" class="small">Source and availability time</text><text x="84" y="255" class="small">Snapshot at decision cutoff</text>
<rect x="410" y="145" width="290" height="151" rx="14" class="teal"/><text x="434" y="188" class="label">02  Decision packet</text><text x="434" y="226" class="small">Admitted facts only</text><text x="434" y="255" class="small">Question, cash, inventory</text>
<rect x="760" y="145" width="290" height="151" rx="14" class="blue"/><text x="784" y="188" class="label">03  Candidate context</text><text x="784" y="226" class="small">Exact Jervis version + source</text><text x="784" y="255" class="small">Continuing trader identity</text>
<rect x="1110" y="145" width="330" height="151" rx="14" class="card"/><text x="1134" y="188" class="label">04  Action hypotheses</text><text x="1134" y="226" class="small">Hold A · sell A · buy B</text><text x="1134" y="255" class="small">Switch A to B, separately</text>
<path d="M351 220H403M701 220H753M1051 220H1103" class="arrow"/>
<rect x="1110" y="364" width="330" height="120" rx="14" class="teal"/><text x="1134" y="406" class="label">05  Historical replay</text><text x="1134" y="442" class="small">Same timing, costs and accounting</text><path d="M1275 298V357" class="arrow"/>
<rect x="760" y="364" width="290" height="120" rx="14" class="amber"/><text x="784" y="406" class="label">06  Diagnose</text><text x="784" y="442" class="small">Outcome revealed afterward</text><path d="M1104 425H1056" class="arrow"/>
<rect x="410" y="364" width="290" height="120" rx="14" class="blue"/><text x="434" y="406" class="label">07  Candidate revision</text><text x="434" y="442" class="small">Store; test on later cases</text><path d="M754 425H706" class="arrow"/><path d="M557 357V303" class="arrow dash"/>
<rect x="60" y="550" width="1380" height="100" rx="14" class="card"/><text x="84" y="586" class="label">Observed research boundary</text><text x="430" y="586" class="small">Public fixtures use invented paths and fixed actions; historical candidate stayed unpromoted.</text><text x="84" y="619" class="muted">The later outcome must never enter the earlier packet. Replay completion is not evidence of trading skill or a live fill.</text>
</svg>
