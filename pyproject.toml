[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "guanlan-research-slice"
version = "0.1.0"
description = "Synthetic public research slice from the Guanlan A-share architecture"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/a_share_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
